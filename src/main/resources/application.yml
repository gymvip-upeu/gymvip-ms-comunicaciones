server:
  port: ${PORT:8085}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: gymvip-comunicaciones
  datasource:
    url: ${COMMS_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/gymvip}}
    username: ${COMMS_DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${COMMS_DB_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${COMMS_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${COMMS_DB_POOL_MIN_IDLE:1}
      connection-timeout: 20000
      pool-name: GymVipCommsPool
      schema: ${COMMS_DB_SCHEMA:comms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        default_schema: ${COMMS_DB_SCHEMA:comms}
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    schemas: ${COMMS_DB_SCHEMA:comms}
    default-schema: ${COMMS_DB_SCHEMA:comms}
    table: flyway_schema_history_comms
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration

comms:
  mode: ${COMMS_MODE:simulation} # simulation | production
  service-token: ${COMMS_SERVICE_TOKEN:gymvip-internal-token-2026}

whatsapp:
  enabled: ${WHATSAPP_ENABLED:true}
  provider: ${WHATSAPP_PROVIDER:meta} # meta | simulation
  api-version: ${WHATSAPP_API_VERSION:v20.0}
  phone-number-id: ${WHATSAPP_PHONE_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  business-account-id: ${WHATSAPP_WABA_ID:}
  business-handle: ${WHATSAPP_HANDLE:@vipcenterfit}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:gymvip_meta_webhook_token_2026}
  app-secret: ${WHATSAPP_APP_SECRET:}

email:
  mode: ${EMAIL_MODE:${COMMS_MODE:simulation}} # simulation | production
  provider: ${EMAIL_PROVIDER:simulation} # simulation | resend
  from: ${EMAIL_FROM:notificaciones@gymvip.pe}
  resend:
    api-key: ${RESEND_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
