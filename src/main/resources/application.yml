server:
  port: ${PORT:8085}

spring:
  application:
    name: gymvip-comunicaciones
  datasource:
    # ADVERTENCIA ARQUITECTURAL: La base de datos H2 en memoria (jdbc:h2:mem:commsdb)
    # pierde los estados e intentos de comunicación al reiniciar el servicio o contenedor.
    # Para persistencia local continua, use jdbc:h2:file:./data/commsdb o PostgreSQL en producción.
    url: jdbc:h2:mem:commsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

comms:
  mode: ${COMMS_MODE:simulation} # simulation | production
  service-token: ${COMMS_SERVICE_TOKEN:gymvip-internal-token-2026}

whatsapp:
  provider: ${WHATSAPP_PROVIDER:meta} # meta | simulation
  api-version: ${WHATSAPP_API_VERSION:v20.0}
  phone-number-id: ${WHATSAPP_PHONE_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  business-account-id: ${WHATSAPP_WABA_ID:}
  business-handle: ${WHATSAPP_HANDLE:@vipcenterfit}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:gymvip_meta_webhook_token_2026}
  app-secret: ${WHATSAPP_APP_SECRET:}
